version: 0.0.2
type: plugin
author: athena-technologies
name: barcode_reader
label:
  en_US: Barcode Reader
  ja_JP: バーコードリーダー
description:
  en_US: Read common barcodes and QR codes from an uploaded image inside Dify.
  ja_JP: Difyにアップロードされた画像からバーコード・QRコードを読み取ります。
created_at: "2026-09-06T00:00:00Z"
icon: icon.svg
privacy: PRIVACY.md

resource:
  memory: 268435456
  permission:
    tool:
      enabled: true

plugins:
  tools:
    - provider/barcode_reader.yaml

meta:
  version: 0.0.1
  minimum_dify_version: "1.0.0"
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
